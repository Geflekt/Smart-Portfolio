spring:
  application:
    name: smart-portfolio-backend

  datasource:
    url: ${NEON_DB_URL}
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 60000
      connection-timeout: 30000


  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
      show-sql: false


  ai:
    openai:
      api-key: dummy-key-bypass
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      image:
        enabled: false
      chat:
        base-url: https://api.groq.com/openai
        api-key: ${GROQ_API_KEY}
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: 0.3

      embedding:
        base-url: https://api.jina.ai
        api-key: ${JINA_API_KEY}
        options:
          model: jina-embeddings-v2-base-en

    vectorstore:
      pgvector:
        table-name: resume_embeddings
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
  cache:
    type: caffeine
    cache-names: portfolio_projects, ai_responses, portfolio_profile, portfolio_experiences, portfolio_sponsors
    caffeine:
      spec: maximumSize=100,expireAfterWrite=24h

portfolio:
  frontend-url: ${FRONTEND_URL}
  admin-secret: ${ADMIN_SECRET}
  github:
    username: ${GITHUB_USERNAME:fierce-adventurer}
    token: ${GITHUB_TOKEN:}
  notification:
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL}

server:
  port: 8080
  forward-headers-strategy: framework

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

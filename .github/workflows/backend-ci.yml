name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Triggers on every push to main
  pull_request:
    branches: [ "main" ] # Also tests pull requests

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # Required permissions to push to GitHub's Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Sets up Docker Buildx for advanced caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GHCR using the automatic GitHub token (No setup required!)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Executes your multi-stage Dockerfile
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # Only pushes if it's not a PR
          tags: ghcr.io/${{ github.repository_owner }}/smart-portfolio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

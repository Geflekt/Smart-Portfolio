name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs in using the specific actor triggering the workflow
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Grabs the full Org/Repo string (e.g., MyCommunity/Smart-Portfolio) and lowercases it
      - name: Format Organization and Repo Name
        run: |
          echo "IMAGE_PATH=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # Tell Docker to run inside your specific folder
          context: ./smart-portfolio-backend
          # Explicitly point to the Dockerfile inside that folder
          file: ./smart-portfolio-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.IMAGE_PATH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render to pull the latest image..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
name: Deploy Backend to Render

on:
  push:
    branches: [ "main" ] # Automatically triggers when you push to main

jobs:
  # ---------------------------------------------------
  # JOB 1: Build the Java App and Push Docker Image
  # ---------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub provides this automatically

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Converts repo owner name to lowercase to prevent Docker tag errors
          tags: ghcr.io/${{ github.repository_owner }}/smart-portfolio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------
  # JOB 2: Tell Render to Pull the New Image
  # ---------------------------------------------------
  deploy-to-render:
    needs: build-and-push # Ensures this only runs if the build succeeds
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Build successful! Notifying Render to pull the latest image..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
name: Deploy Backend to Render

on:
  push:
    branches: [ "main" ] # Automatically triggers when you push to main

jobs:
  # ---------------------------------------------------
  # JOB 1: Build the Java App and Push Docker Image
  # ---------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GitHub Container Registry

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub provides this automatically

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Converts repo owner name to lowercase to prevent Docker tag errors
          tags: ghcr.io/${{ github.repository_owner }}/smart-portfolio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
  needs: build-and-publish
  if: github.event_name != 'pull_request'
  runs-on: ubuntu-latest

  steps:
    - name: Trigger Render Deployment
      run: |
        echo "Triggering Render to pull the latest image..."
        # Double quotes around the secret are CRITICAL to prevent malformed URL errors
        curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"